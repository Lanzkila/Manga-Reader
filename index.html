<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirin Manga Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
     <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class='header' id='mainHeader'>
        <h2>Kirin Reader</h2>
        <div class='controls-wrapper' id='topControls' style='display:none'>
            <div class='btn-group' id='zoomControls'>
                <button class='btn-toggle' id='zoomOut'>W -</button>
                <button class='btn-toggle' id='zoomIn'>W +</button>
            </div>
            
            <div class='btn-group'>
                <button class='btn-toggle active' id='modeListBtn'>SCROLL</button>
                <button class='btn-toggle' id='modeBookBtn'>BOOK (RTL)</button>
            </div>

            <span class='page-info' id='pageCounter'>0 Pgs</span>
            <button class='btn-small' onclick='location.reload()'>NEW</button>
        </div>
    </div>

    <div class='manga-nav prev' id='navPrev'/>
    <div class='manga-nav next' id='navNext'/>

    <div id='setup'>
        <div class='drop-zone' id='dropArea' onclick='document.getElementById(&quot;fileInput&quot;).click()'>
            <p style='font-size: 18px;'>Drop <b>.cbz</b> or <b>.zip</b></p>
            <span style='font-size: 12px; color: #666;'>Klik untuk pilih fail manga kau</span>
        </div>
        <input id='fileInput' type='file'/>
        <div id='status'>Memproses halaman manga...</div>
    </div>

    <div id='viewer'/>
   <script src="scripts.js"></script>
</body>
</html>
