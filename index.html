<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirin Reader</title>
    
    <!-- Pustaka JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- Fail Gaya CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header" id="mainHeader">
        <h2>Kirin Reader</h2>
        <div class="controls-wrapper" id="topControls" style="display:none">
            <div class="btn-group" id="zoomControls">
                <button class="btn-toggle" id="zoomOut">W -</button>
                <button class="btn-toggle" id="zoomIn">W +</button>
            </div>
            
            <div class="btn-group">
                <button class="btn-toggle active" id="modeListBtn">SCROLL</button>
                <button class="btn-toggle" id="modeBookBtn">BOOK (RTL)</button>
            </div>

            <span class="page-info" id="pageCounter">0 Pgs</span>
            <button class="btn-small" onclick="location.reload()">NEW</button>
        </div>
    </div>

    <div class="manga-nav prev" id="navPrev"></div>
    <div class="manga-nav next" id="navNext"></div>

    <div id="setup">
        <div class="drop-zone" id="dropArea" onclick="document.getElementById('fileInput').click()">
            <p style="font-size: 18px;">Drop <b>.cbz</b> or <b>.zip</b></p>
            <span style="font-size: 12px; color: #666;">Klik untuk pilih fail manga kau</span>
        </div>
        <input id="fileInput" type="file">
        <div id="status">Memproses halaman manga...</div>
        
        <!-- Bahagian Recent Read -->
        <div id="recentContainer" class="recent-container" style="display:none;">
            <div class="recent-header-wrapper">
                 <h3>Bacaan Terkini</h3>
                 <button id="clearAllBtn" class="btn-clear-all">Padam Semua</button>
                </div>
            <div id="recentList"></div>
        </div>
    </div>

    <div id="viewer"></div>

    <!-- Footer -->
    <footer class='site-footer'>
    &copy; <span id='currentYear'></span> Kirin Reader. Hak cipta terpelihara.
    </footer>

    <!-- Fail Logik JavaScript -->
    <script src="scripts.js"></script>
</body>
</html>
